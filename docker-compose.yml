services:
  # Holds the A2A tasks for every replica (TASKS_REDIS_URL), so whichever replica receives a
  # continue finds the task another replica paused, together with each task's events, the lease
  # naming the replica that runs it and each person's remembered merchant categories. Redis also
  # writes all of it to an append-only file every second, so paused tasks survive a Redis restart;
  # the replicas share tasks with or without that file.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    deploy: { resources: { limits: { memory: 64M } } }
    volumes:
      - cal_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  # The card agent, reading statements from the folder named in .env (STATEMENTS_DIR), one
  # sub-folder per person. The statements page writes uploads into that folder, so the mount is
  # writable and the process runs as the host user who owns it (scripts/common.sh exports HOST_UID
  # and HOST_GID). The registered callers come from the file register-caller.sh writes, mounted
  # read-only; it must exist before the first start.
  cal-agent:
    build: .
    image: cal-agent:local
    user: "${HOST_UID:?run through scripts/start.sh}:${HOST_GID:?run through scripts/start.sh}"
    # The edge spreads requests over the replicas, and whichever replica receives a continue picks
    # up the paused task. Redeploy only while no task is working: stopping a replica mid-task ends
    # that task's stream, and the caller's fetch fails.
    # To try a different number of replicas, scale the running stack: in a shell, source
    # scripts/common.sh and run load_env (compose needs the variables it exports), then run
    # compose up -d --scale cal-agent=N --wait. The next start.sh goes back to the count set here.
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    env_file:
      - path: ./.env
        required: true
    # The container always listens on 8030; SERVER_PORT from .env only chooses the host port the
    # edge publishes.
    environment:
      SERVER_PORT: 8030
      STATEMENTS_DIR: /statements
      A2A_CALLERS_FILE: /allowed-callers.yaml
      # The replicas share their tasks through Redis. To keep tasks in the process's memory
      # instead, blank this value and also set replicas to 1 above: with several replicas, a
      # continue reaching a replica other than the one that paused the task would find no task.
      # start.sh --host already runs this way, as one process with its tasks in memory.
      TASKS_REDIS_URL: redis://redis:6379/0
    volumes:
      - ${STATEMENTS_DIR:?set STATEMENTS_DIR in .env}:/statements
      - ${A2A_CALLERS_FILE:-./allowed-callers.yaml}:/allowed-callers.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8030/health')"
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy

  # The only service that publishes the agent's port; nginx/default.conf proxies to the replicas.
  edge:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    deploy: { resources: { limits: { memory: 64M } } }
    ports:
      - "${SERVER_PORT:-8030}:8030"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8030/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      cal-agent:
        condition: service_healthy

volumes:
  cal_redis:
